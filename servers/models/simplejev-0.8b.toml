name = "simplejev-0.8b"
port = 8116
cwd = "src/simple-jev"
command = ["venvs/a-simplejev/bin/simple-jev", "--model", "Qwen/Qwen3.5-0.8B", "--revision", "2fc06364715b967f1860aea9cf38778875588b17",
           "--served-model-name", "simplejev-0.8b", "--device", "cuda", "--dtype", "float32",
           "--classifier-prompt-policy", "baseline", "--max-model-len", "4096", "--max-batch-size", "4", "--max-batch-tokens", "4096",
           "--port", "8116"]
