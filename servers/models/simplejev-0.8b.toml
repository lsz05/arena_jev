notes = "featherless-ai/simple-jev@c5363e0 hf-server (`simple-jev`, authors' /v1/systemone alias of /v1/classifier), untrained stock Qwen/Qwen3.5-0.8B@2fc0636, the author-documented small-model command used for JevBench v1.4 'SimpleJev (Qwen3.5-0.8B, CPU)' (baseline prompt policy, float32, 4096-token limit per rendered question incl. chat template; over-limit -> 422) but on CUDA; assistant-prefill option-label logits; prompt wrapper adds ~330 + ~26 tokens per option to the request text (so max_input_tokens 3000 holds up to ~29 options)"

