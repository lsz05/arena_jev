<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard · Jev Arena</title>
<link rel="stylesheet" href="../static/base.css">
<style>
main { max-width: 1600px; } /* room for the whole table on wide screens; narrower ones scroll it */
</style>
</head>
<body>
<header>
  <h1>Jev Arena</h1>
  <nav><a href="../">Home</a><a href="./" class="on">Leaderboard</a><a href="../bench/">Bench</a><a href="../uno/">UNO</a><a href="../connect4/">Connect Four</a></nav>
  <span class="spacer"></span><button id="theme" type="button">◐ Theme</button>
</header>
<main>
  <section class="hero">
    <h2>Leaderboard <span class="live" id="live" hidden>live</span></h2>
    <p class="lead" id="meta">loading…</p>
    <div class="chips" id="chips"></div>
    <div class="scroll-x"><table class="sortable" id="board"></table></div>
    <div id="defs"></div>
  </section>
  <section>
    <h2>Does JevBench accuracy predict UNO strength?</h2>
    <p class="lead" id="corr"></p>
    <div id="scatter"></div>
  </section>
</main>
<div class="tooltip" id="tip"></div>
<script src="../static/board.js"></script>
<script>
initTheme();
const J = "JevBench 231", U = "UNO", C = "Connect Four";
const COLS = [
  {key: "display", label: "Model", cell: modelCell},
  {key: "params", label: "Size", num: true, rank: true, dir: 1, hl: false, cell: sizeCell},
  {key: "jb_acc", group: J, label: "Accuracy", num: true, rank: true, title: "all 231 public items", cell: r => fmt(r.jb_acc, v => pct(v))},
  {key: "jb_hard", group: J, label: "Hard", num: true, rank: true, title: "the 111 hard items", cell: r => fmt(r.jb_hard, v => pct(v))},
  {key: "games", group: U, label: "Games", num: true, rank: true, hl: false, cell: r => `${r.games}` + (TARGET ? `<span class="gbar" title="${r.games} / ${TARGET}"><span style="width:${Math.min(100, 100 * r.games / TARGET).toFixed(1)}%"></span></span>` : "")},
  {key: "ts_score", group: U, label: "TrueSkill", num: true, rank: true, title: "μ − 3σ", cell: r => fmt(r.ts_score, v => `${v.toFixed(1)}<small>μ ${r.ts_mu.toFixed(1)} ± ${r.ts_sigma.toFixed(1)}</small>`)},
  {key: "win_rate", group: U, label: "Win rate", num: true, rank: true, cell: r => fmt(r.win_rate, v => `${pct(v)}<small>${pct(r.win_rate_ci95[0])}–${pct(r.win_rate_ci95[1])}</small>`)},
  {key: "avg_points_won", group: U, label: "Pts won", num: true, rank: true, cell: r => fmt(r.avg_points_won, v => v.toFixed(1))},
  {key: "avg_points_left", group: U, label: "Pts left", num: true, rank: true, dir: 1, cell: r => fmt(r.avg_points_left, v => v.toFixed(1))},
  {key: "memory_rounds", group: U, label: "Memory", num: true, rank: true, cell: r => fmt(r.memory_rounds, v => `${v.toFixed(2)}<small>${r.max_input_tokens ? "limit " + r.max_input_tokens.toLocaleString("en-US") + " tok" : "rounds"}</small>`)},
  {key: "wd4_bluff", group: U, label: "Bluff", num: true, rank: true, dir: 1, cell: r => fmt(r.wd4_bluff, v => pct(v))},
  {key: "challenge_right", group: U, label: "Challenge ✓", num: true, rank: true, cell: r => fmt(r.challenge_right, v => pct(v))},
  {key: "latency_ms", group: U, label: "Latency", num: true, rank: true, dir: 1, cell: r => fmt(r.latency_ms, v => Math.round(v) + " ms")},
  {key: "c4_score", group: C, label: "Points", num: true, rank: true, title: "per game: win 1, draw 0.5 (wins-draws-losses below)", cell: r => fmt(r.c4_score, v => `${pct(v)}<small>${r.c4_wins}-${r.c4_draws}-${r.c4_losses}</small>`)},
  {key: "c4_ts_score", group: C, label: "TrueSkill", num: true, rank: true, title: "μ − 3σ", cell: r => fmt(r.c4_ts_score, v => `${v.toFixed(1)}<small>μ ${r.c4_ts_mu.toFixed(1)} ± ${r.c4_ts_sigma.toFixed(1)}</small>`)},
  {key: "c4_took_win", group: C, label: "Took win", num: true, rank: true, title: "played a winning column when it had one", cell: r => fmt(r.c4_took_win, v => `${pct(v)}<small>of ${r.c4_win_chances}</small>`)},
  {key: "c4_blocked", group: C, label: "Blocked", num: true, rank: true, title: "blocked the opponent's immediate win when it had to", cell: r => fmt(r.c4_blocked, v => `${pct(v)}<small>of ${r.c4_threats}</small>`)},
];
// Each metric's definition: shown on hover over its header and chip, and listed under the table.
const TIPS = {
  params: "Parameters held by the model's server after its own load code, counted at load time (every tensor once). Hover a size for the exact count.",
  jb_acc: "Share of the 231 public JevBench items answered correctly.",
  jb_hard: "Accuracy on the 111 hard public JevBench items.",
  games: "UNO games played; the bar shows progress toward the target per model.",
  ts_score: "UNO TrueSkill: conservative rating μ − 3σ from 4-player games (the winner ranks first, the others by points left in hand), with each model's skill taken as fixed; below, μ and σ.",
  win_rate: "Share of UNO games won; below, the 95% Wilson interval.",
  avg_points_won: "Average points scored per UNO game: the winner takes the sum of the other hands, everyone else scores 0.",
  avg_points_left: "Average points still in hand when a UNO game ends (0 for the winner; lower is better).",
  memory_rounds: "Average rounds of UNO history kept per request (up to 5; fewer only when the model's input limit cannot hold them).",
  wd4_bluff: "Share of its Wild Draw Fours played while holding a card of the current color (lower is more honest).",
  challenge_right: "Share of its decisions on a Wild Draw Four played against it (challenge or accept) that matched the truth.",
  latency_ms: "Average time per model request during UNO.",
  c4_score: "Connect Four league points: win 1, draw 0.5, loss 0, averaged over its games; below, wins-draws-losses.",
  c4_ts_score: "Connect Four TrueSkill: conservative rating μ − 3σ from the league games, a draw counting as a tie and each model's skill taken as fixed; below, μ and σ.",
  c4_took_win: "When a column would have won at once, how often the model played it; below, the number of such moves.",
  c4_blocked: "When the opponent could win with its next disc (and the model could not win at once itself), how often the model blocked it; below, the number of such moves.",
};
COLS.forEach(c => { if (TIPS[c.key]) { c.tip = TIPS[c.key]; delete c.title; } });
const GROUP_TIPS = {
  [J]: "JevBench: 231 public decision items (48 easy, 72 original, 111 hard), run locally with the official harness.",
  [U]: "UNO: 4-player Swiss tournament, official rules with the Wild Draw Four challenge.",
  [C]: "Connect Four: the newest league, in which every pair of models plays each opening with both colors.",
};
let TARGET = null, table = null, timer = null;

async function load() {
  const b = await (await fetch("api/leaderboard")).json();
  TARGET = b.target_games_per_model;
  if (!table) {
    const has = k => b.rows.some(r => r[k] != null);
    table = SortTable({table: "#board", chips: "#chips", cols: COLS, sortKey: has("ts_score") ? "ts_score" : has("jb_acc") ? "jb_acc" : "params",
                       sortDir: has("ts_score") || has("jb_acc") ? -1 : 1, groupTips: GROUP_TIPS});
    $("#defs").innerHTML = defsList(COLS, [["⚠", "A caveat on this model's result; hover the mark to read it."],
                                           ["–", "No result yet for this metric; such models are listed last when ranking by it."]]);
  }
  table.render(b.rows);
  const c4 = b.c4, live = b.in_progress || c4?.state === "running";  // poll while the UNO run or the league goes on
  $("#meta").textContent = `${b.rows.length} models · ${b.games.toLocaleString("en-US")} UNO games` + (TARGET ? ` · target ${TARGET} games per model` : "") +
    (c4 ? ` · Connect Four league ${c4.pairs_done}/${c4.pairs} pairs, ${c4.games.toLocaleString("en-US")} games` + (c4.state === "running" ? " (live)" : "") : "") + ` · updated ${b.updated}`;
  $("#live").hidden = !live;
  scatter(b.rows);
  if (live && !timer) timer = setInterval(load, 30000);
  if (!live && timer) { clearInterval(timer); timer = null; }
}

function spearman(xs, ys) {
  const rank = a => { const idx = a.map((v, i) => [v, i]).sort((p, q) => p[0] - q[0]); const r = []; idx.forEach(([, i], k) => r[i] = k); return r; };
  const rx = rank(xs), ry = rank(ys), n = xs.length;
  const d2 = rx.reduce((s, v, i) => s + (v - ry[i]) ** 2, 0);
  return 1 - 6 * d2 / (n * (n * n - 1));
}

function scatter(rows) {
  const pts = rows.filter(r => r.jb_acc != null && r.ts_score != null && r.games > 0);
  if (pts.length < 3) { $("#corr").textContent = "Appears once at least three models have both a JevBench result and UNO games."; $("#scatter").innerHTML = ""; return; }
  const rho = spearman(pts.map(r => r.jb_acc), pts.map(r => r.ts_score));
  $("#corr").textContent = `Each dot is a model: JevBench accuracy (x) against UNO TrueSkill (y). Spearman rank correlation ρ = ${rho.toFixed(2)} over ${pts.length} models (1 = same order, 0 = unrelated, −1 = reversed).`;
  const W = 760, H = 380, L = 56, R = 20, T = 16, B = 44;
  const xs = pts.map(r => r.jb_acc), ys = pts.map(r => r.ts_score);
  const x0 = Math.floor(Math.min(...xs) * 20) / 20, x1 = Math.ceil(Math.max(...xs) * 20) / 20;
  const y0 = Math.floor(Math.min(...ys)), y1 = Math.ceil(Math.max(...ys));
  const X = v => L + (W - L - R) * (v - x0) / (x1 - x0 || 1), Y = v => H - B - (H - T - B) * (v - y0) / (y1 - y0 || 1);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="JevBench accuracy against UNO TrueSkill" style="width:100%;max-width:${W}px;height:auto">`;
  for (let v = x0; v <= x1 + 1e-9; v += 0.05) s += `<line class="gridline" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - B}"/><text x="${X(v)}" y="${H - B + 16}" text-anchor="middle">${Math.round(v * 100)}%</text>`;
  const ystep = Math.max(1, Math.ceil((y1 - y0) / 6));
  for (let v = y0; v <= y1; v += ystep) s += `<line class="gridline" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">JevBench public accuracy</text>`;
  s += `<text transform="translate(14 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">UNO TrueSkill (μ − 3σ)</text>`;
  const top = new Set(pts.slice().sort((a, b) => b.ts_score - a.ts_score).slice(0, 3).map(r => r.name));
  pts.forEach((r, i) => {
    s += `<g class="pt" data-i="${i}"><circle class="dot" cx="${X(r.jb_acc)}" cy="${Y(r.ts_score)}" r="6"/><circle cx="${X(r.jb_acc)}" cy="${Y(r.ts_score)}" r="14" fill="transparent"/>` +
      (top.has(r.name) ? `<text class="value" x="${X(r.jb_acc) + 9}" y="${Y(r.ts_score) - 8}">${esc(r.display)}</text>` : "") + `</g>`;
  });
  $("#scatter").innerHTML = s + "</svg>";
  $("#scatter").querySelectorAll(".pt").forEach(g => { const r = pts[+g.dataset.i];
    Tip.bind(g, `<b>${esc(r.display)}</b><br>JevBench ${pct(r.jb_acc)} · TrueSkill ${r.ts_score.toFixed(1)}<br>${r.games} games · win rate ${pct(r.win_rate)}`); });
}
load().catch(e => { $("#meta").textContent = "Could not load the leaderboard: " + e.message; });
</script>
</body>
</html>
